<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubix TaskFlow</title>
<style>
:root{--bg:#0e1116;--surface:#171b22;--surface-2:#1f242d;--surface-3:#262d38;--card:#1c212a;--border:#2a3040;--border-2:#3a4155;--text:#e4e8f0;--text-2:#9fadbf;--muted:#8b94a8;--muted-2:#5f6879;--accent:#7c5cff;--accent-2:#9d7bff;--accent-soft:rgba(124,92,255,.15);--accent-soft-2:rgba(124,92,255,.3);--ok:#2dd4a7;--ok-soft:rgba(45,212,167,.16);--warn:#f0a338;--warn-soft:rgba(240,163,56,.16);--danger:#f4676b;--danger-soft:rgba(244,103,107,.16);--glass:rgba(11,16,26,.6);--glass-hover:rgba(255,255,255,.09);--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 6px 16px rgba(0,0,0,.45);--shadow-lg:0 24px 60px rgba(0,0,0,.6);--ring:0 0 0 3px rgba(124,92,255,.35);--r:12px;--r-sm:9px;--r-lg:16px}
html.light{--bg:#eef1f6;--surface:#fff;--surface-2:#f3f5f9;--surface-3:#e8ecf3;--card:#fff;--border:#e2e6ee;--border-2:#c8d0dc;--text:#141b2b;--text-2:#5b667c;--muted:#5b667c;--muted-2:#8a94a8;--accent:#6a4bff;--accent-2:#8b6cff;--accent-soft:rgba(106,75,255,.12);--accent-soft-2:rgba(106,75,255,.24);--ok:#0ea877;--ok-soft:rgba(14,168,119,.14);--warn:#c47a0c;--warn-soft:rgba(196,122,12,.15);--danger:#d94144;--danger-soft:rgba(217,65,68,.12);--glass:rgba(20,27,43,.6);--glass-hover:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 4px 12px rgba(16,24,40,.1);--shadow-lg:0 24px 50px rgba(16,24,40,.2)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;display:inline-flex;align-items:center;gap:7px;transition:.15s}
input,select,textarea{font:inherit;color:var(--text);background:transparent;border:1.5px solid var(--border);border-radius:var(--r-sm);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,134,156,.4);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
#app{height:100%;display:flex;flex-direction:column}
.hdr{height:56px;flex-shrink:0;z-index:40;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--glass);backdrop-filter:blur(14px);color:#fff}
html.light .hdr{color:var(--text)}
.logo{display:flex;align-items:center;gap:9px;font-weight:750;font-size:15px;color:inherit;padding:4px 6px;border-radius:var(--r-sm);text-decoration:none}
.logo-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7c5cff,#5b8def);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.hdr-title{font-size:15px;font-weight:700;background:transparent;border:1.5px solid transparent;color:inherit;padding:5px 9px;border-radius:var(--r-sm);max-width:30vw}
.hdr-title:focus{background:var(--surface);color:var(--text);border-color:var(--accent)}
.spacer{flex:1}
.presence{display:flex;gap:6px;align-items:center}
.presence-user{width:32px;height:32px;border-radius:50%;position:relative;background:linear-gradient(135deg,#7c5cff,#5b8def);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:12px;border:2px solid rgba(255,255,255,.35);background-size:cover;background-position:center;flex:none}
.presence-user::after{content:"";position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.hdr-search{height:34px;width:190px;max-width:36vw;padding:0 12px;color:#fff;background:rgba(255,255,255,.14);border:1.5px solid transparent;border-radius:var(--r-sm)}
.hdr-search::placeholder{color:rgba(255,255,255,.65)}
.hdr-search:focus{background:var(--surface);color:var(--text);border-color:var(--accent)}
.hdr-btn{height:34px;padding:0 14px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:600;font-size:13px}
.hdr-icon{width:34px;height:34px;justify-content:center;border-radius:var(--r-sm);color:rgba(255,255,255,.9);font-size:16px;position:relative}
html.light .hdr-icon{color:var(--muted)}
.hdr-icon:hover{background:var(--glass-hover);color:#fff}
.hdr-icon .sync-dot{position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--muted-2);border:1.5px solid var(--bg)}
.hdr-icon .sync-dot.on{background:var(--ok)}
.hdr-user{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 2px;border-radius:999px;height:40px;position:relative}
.hdr-user-name{font-weight:600;font-size:13px;color:inherit;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background:transparent;padding:4px;border-radius:6px}
.hdr-user-name:hover{background:rgba(255,255,255,.12)}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#5b8def);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border:2px solid rgba(255,255,255,.35)}
.avatar-inner{width:100%;height:100%;background-size:cover;background-position:center;display:inline-flex;align-items:center;justify-content:center}
.avatar-inner.with-img{color:transparent}
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;min-width:140px;font-size:13px;font-weight:600;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:5px;display:none;flex-direction:column;gap:2px}
.dd.open .dd-menu{display:flex}
.dd-opt{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.dd-opt:hover{background:var(--surface-2);color:var(--text)}
.dd-opt.active{background:var(--accent-soft);color:var(--accent-2)}
.dd-swatch{width:10px;height:10px;border-radius:50%;flex:none}
.hdr .dd-btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;min-width:120px}
.board-scroll{flex:1;overflow:auto;position:relative}
.canvas{position:relative;min-width:100%;min-height:100%;padding:8px}
.list{position:absolute;width:310px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden}
.list-banner{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--surface-2);cursor:pointer}
.list-hd{display:flex;align-items:center;gap:6px;padding:10px 8px 6px 10px;cursor:grab}
.list-dot{width:9px;height:9px;border-radius:50%;flex:none}
.list-title{flex:1;min-width:0;font-weight:700;font-size:13.5px;background:transparent;border:1.5px solid transparent;padding:4px 7px;color:var(--text);border-radius:var(--r-sm)}
.list-count{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px}
.list-tools{display:flex;gap:2px}
.list-tool{width:24px;height:24px;justify-content:center;border-radius:6px;color:var(--muted-2);font-size:14px}
.list-desc{font-size:12px;color:var(--muted);padding:0 14px 6px;white-space:pre-wrap;max-height:60px;overflow:hidden}
.list-prog{height:3px;margin:2px 10px 6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.list-prog-fill{height:100%;background:var(--accent);border-radius:999px}
.list-cards{overflow-y:auto;max-height:60vh;min-height:12px;padding:4px 8px;display:flex;flex-direction:column;gap:8px}
.list.drag-over .list-cards{background:var(--accent-soft);border-radius:var(--r)}
.list-empty{font-size:12px;color:var(--muted-2);text-align:center;padding:14px 8px;border:1.5px dashed var(--border);border-radius:var(--r)}
.list-add{margin:2px 8px 10px;padding:8px;border-radius:var(--r);color:var(--muted);justify-content:center;font-size:13px;font-weight:600;border:1.5px dashed var(--border)}
.card{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 12px;cursor:grab;transition:.16s;overflow:hidden}
.card.is-work{border-color:var(--accent-soft-2)}
.card.is-new::before{content:"";position:absolute;left:-1.5px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.card-banner{width:100%;aspect-ratio:16/9;max-height:130px;object-fit:cover;display:block;border-radius:8px;background:var(--surface-2);margin:-2px 0 2px}
.card-title{font-size:13.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.card-desc{font-size:12.5px;color:var(--muted);line-height:1.45;max-height:60px;overflow:hidden;padding-left:8px;border-left:2px solid var(--border);white-space:pre-wrap}
.card-prog{display:flex;align-items:center;gap:8px}
.card-prog-track{flex:1;height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.card-prog-fill{height:100%;background:var(--accent);border-radius:999px}
.card-prog-lbl{font-size:11px;font-weight:700;color:var(--muted);min-width:3.4em;text-align:right}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px}
.card-acts{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0}
.card:hover .card-acts{opacity:1}
.card-acts button{width:24px;height:24px;justify-content:center;border-radius:6px;background:var(--surface);color:var(--muted-2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:11.5px}
.card-tasks{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow:hidden}
.task-mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:18px}
.task-mini .cbox{width:14px;height:14px;flex:none;border-radius:4px;border:1.5px solid var(--border-2);color:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.task-mini.done .cbox{background:var(--ok);border-color:var(--ok);color:#fff}
.task-mini.done .txt{text-decoration:line-through;color:var(--muted-2)}
.task-mini .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-mini{padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700}
.badge-mini.prio-low{background:var(--ok-soft);color:var(--ok)}
.badge-mini.prio-med{background:var(--warn-soft);color:var(--warn)}
.badge-mini.prio-high{background:var(--danger-soft);color:var(--danger)}
.badge-mini.new{background:var(--accent);color:#fff}
.badge-mini.work{background:var(--accent-soft);color:var(--accent-2)}
.card-flags{display:flex;gap:5px;flex-wrap:wrap}
.flag-new{padding:2px 8px;border-radius:999px;color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;background:linear-gradient(135deg,#7c5cff,#5b8def)}
.flag-work{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--accent-2);background:var(--accent-soft)}
.overlay{position:fixed;inset:0;background:rgba(5,8,14,.8);display:none;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:100;overflow:auto;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:680px;padding:22px;display:flex;flex-direction:column;gap:16px;position:relative}
.modal h3{font-size:17px;font-weight:700}
.modal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;justify-content:center;border-radius:var(--r-sm);color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea,.field select{padding:9px 12px;width:100%}
.field textarea{resize:vertical;min-height:66px;font-family:inherit;line-height:1.45}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.btn{padding:9px 16px;border-radius:var(--r-sm);font-weight:600;font-size:13px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.upload{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);border:1.5px dashed var(--border);background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.upload img{width:100%;height:100%;object-fit:cover;display:none}
.upload.has img{display:block}
.upload-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;font-weight:600;background:rgba(0,0,0,.4);opacity:0}
.upload.has:hover .upload-hint{opacity:1}
.upload-actions{display:flex;gap:8px;margin-top:6px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-editor{padding:10px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.task-editor.done{opacity:.75}
.task-row1{display:flex;align-items:center;gap:8px}
.task-editor .cbox{width:20px;height:20px;flex:none;border-radius:5px;border:1.5px solid var(--border-2);color:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer}
.task-editor.done .cbox{background:var(--ok);border-color:var(--ok);color:#fff}
.task-text{flex:1;min-width:0;background:transparent;border:1.5px solid transparent;padding:4px 6px;border-radius:6px;font:inherit;color:var(--text);font-size:13px}
.task-del{width:26px;height:26px;justify-content:center;border-radius:6px;color:var(--muted-2);font-size:13px}
.task-row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:28px}
.task-row2 select,.task-row2 input[type=date]{padding:0 8px;font-size:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);height:28px}
.task-toggle{padding:0 10px;height:28px;border-radius:6px;font-size:11.5px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
.task-toggle.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.task-cmt-btn{margin-left:auto;padding:0 10px;height:28px;border-radius:6px;background:var(--surface);border:1.5px solid var(--border);color:var(--muted);font-size:11.5px;font-weight:600}
.task-cmt-btn.has{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.task-comments{display:none;flex-direction:column;gap:6px;padding:6px 0 0 28px}
.task-comments.open{display:flex}
.task-comment{display:flex;gap:6px;padding:6px 8px;background:var(--surface);border-radius:6px;font-size:12px}
.task-comment .who{font-weight:700;color:var(--accent-2);flex:none}
.task-comment .txt{flex:1;color:var(--text-2);overflow-wrap:anywhere;white-space:pre-wrap}
.task-cmt-add{display:flex;gap:6px}
.task-cmt-add input{flex:1;padding:6px 10px;font-size:12px;border-radius:6px}
.task-cmt-add button{padding:6px 12px;font-size:12px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600}
.task-empty{font-size:12.5px;color:var(--muted-2);text-align:center;padding:14px;border:1.5px dashed var(--border);border-radius:var(--r)}
.task-add-row{display:flex;gap:8px;margin-top:8px}
.task-add-row input{flex:1}
.task-add-row button{width:40px;justify-content:center;border-radius:var(--r-sm);background:var(--surface-2);border:1.5px solid var(--border);color:var(--muted);font-size:16px}
.player{display:none;flex-shrink:0;height:78px;gap:12px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(14px);border-top:1px solid var(--border);align-items:center;position:relative;z-index:30}
.player.open{display:flex}
.player-info{min-width:0;max-width:200px;flex:none}
.player-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{font-size:11px;color:var(--muted-2)}
.pc-btn{width:36px;height:36px;justify-content:center;border-radius:50%;background:var(--surface-2);color:var(--text);flex:none;border:1.5px solid var(--border);font-size:14px}
.pc-btn.pc-play{width:42px;height:42px;background:var(--accent);color:#fff;border-color:var(--accent)}
.player-controls{display:flex;gap:6px;align-items:center;flex:none}
.player-seek{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.player-seek input[type=range]{flex:1;accent-color:var(--accent);border:none;padding:0;background:transparent}
.player-seek .time{font-size:11.5px;color:var(--muted);min-width:42px;text-align:center}
.player-vol{display:flex;align-items:center;flex:none}
.player-vol input[type=range]{width:80px;accent-color:var(--accent);border:none;padding:0;background:transparent}
.p-add-btn{padding:8px 12px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--accent)}
.player-close{position:absolute;top:6px;right:6px;width:22px;height:22px;color:var(--muted-2)}
#err{position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;padding:10px 16px;font-family:monospace;font-size:12px;display:none;z-index:999;white-space:pre-wrap}
.auth-modal{max-width:420px}
.auth-tabs{display:flex;gap:6px;padding:4px;background:var(--surface-2);border-radius:var(--r-sm)}
.auth-tab{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:600;justify-content:center;color:var(--muted)}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.auth-pane{display:none;flex-direction:column;gap:12px}
.auth-pane.active{display:flex}
.auth-err{color:var(--danger);font-size:12px;min-height:16px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--surface-2);border-radius:var(--r-sm)}
.toggle-row .txt{display:flex;flex-direction:column;gap:2px}
.toggle-row .title{font-weight:600}
.toggle-row .desc{font-size:12px;color:var(--muted)}
.switch{position:relative;width:44px;height:24px;flex:none;cursor:pointer}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s}
.switch .slider::before{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::before{transform:translateX(20px)}
.player-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface-2);border-radius:var(--r-sm);margin-bottom:6px}
.player-row .pav{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,#7c5cff,#5b8def);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background-size:cover;background-position:center}
.player-row .pinfo{flex:1;min-width:0}
.player-row .pname{font-weight:600;font-size:13px}
.player-row .pmeta{font-size:11px;color:var(--muted-2)}
.player-row .pacts{display:flex;gap:6px;flex:none}
.player-row .pacts button{padding:5px 10px;font-size:11.5px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.profile-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;display:none;flex-direction:column;gap:2px;z-index:200}
.profile-menu.open{display:flex}
.profile-menu button{padding:9px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text);justify-content:flex-start}

<script>
(function(){
"use strict";
var errBox=document.getElementById('err');
function showErr(m){ errBox.textContent='Ошибка: '+m; errBox.style.display='block'; setTimeout(function(){ errBox.style.display='none'; },6000); }
window.addEventListener('error', function(e){ showErr(e.message+' @'+e.lineno); });

var STORAGE='kalk-tasks.v1', THEME_KEY='kalk-tasks.theme', BACKUP_KEY='rubix-backup.latest';
var SB_CFG_KEY='rubix-supabase-config', SESSION_KEY='rubix-session';
var BACKUP_EVERY=30000, NAME_MIN=4, NAME_MAX=16, PWD_MIN=4, zCounter=10;
var PRIO_LABEL={low:'Низкий',med:'Средний',high:'Высокий'};
var WEEKDAYS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var REPEAT_KEY='rubix-repeat';

function uid(){ return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function daysUntil(d){ var dt=new Date(d); if(isNaN(dt))return 9999; dt.setHours(0,0,0,0); var t=new Date(); t.setHours(0,0,0,0); return Math.round((dt-t)/86400000); }
function dueLabel(d){ if(!d)return''; var diff=daysUntil(d); if(diff===0)return'Сегодня'; if(diff===1)return'Завтра'; if(diff===-1)return'Вчера'; if(diff>1&&diff<7)return WEEKDAYS[new Date(d).getDay()]; return new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}); }
function relTime(ts){ var diff=Date.now()-(ts||Date.now()); var m=Math.floor(diff/60000); if(m<1)return'только что'; if(m<60)return m+' мин назад'; var h=Math.floor(m/60); if(h<24)return h+' ч назад'; var dd=Math.floor(h/24); if(dd<30)return dd+' дн назад'; return new Date(ts).toLocaleDateString('ru-RU'); }
function cardProgress(c){ var t=c.tasks||[]; if(!t.length)return 0; return Math.round(t.filter(function(x){return x.done;}).length/t.length*100); }
function fmtTime(sec){ if(!isFinite(sec)||sec<0)sec=0; var m=Math.floor(sec/60),s=Math.floor(sec%60); return m+':'+(s<10?'0'+s:s); }
function userInitial(n){ var s=(n||'').trim(); return s?s.charAt(0).toUpperCase():'?'; }
function compressImage(file,maxW,q){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(e){ var img=new Image(); img.onload=function(){ var w=img.width,h=img.height; if(w>maxW){ h=h*maxW/w; w=maxW; } var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
async function hashPwd(uid, pwd){ var buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(uid+'::'+pwd)); return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); }

function getSbConfig(){ var baked=document.getElementById('__baked_sb_config__'); if(baked){ try{ var c=JSON.parse(baked.textContent); if(c&&c.url&&c.key) return c; }catch(e){} } try{ var raw=localStorage.getItem(SB_CFG_KEY); if(raw){ var c2=JSON.parse(raw); if(c2&&c2.url&&c2.key) return c2; } }catch(e){} return null; }
var sb=null;
(function(){ var cfg=getSbConfig(); if(cfg && window.supabase){ try{ sb=window.supabase.createClient(cfg.url, cfg.key); }catch(e){} } })();

function loadSession(){ try{ var raw=localStorage.getItem(SESSION_KEY); if(raw){ var s=JSON.parse(raw); if(s && s.userId && s.name) return s; } }catch(e){} return null; }
function saveSession(s){ try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){} }
var session = loadSession();
var me_avatar = null;

var usersCache=null, usersCacheTs=0;
async function loadUsers(force){
  var now=Date.now();
  if(!force && usersCache && now-usersCacheTs<15000) return usersCache;
  if(sb){ try{ var r=await sb.from('rubix_users').select('*').order('created_at',{ascending:true}); usersCache=r.data||[]; usersCacheTs=now; return usersCache; }catch(e){ usersCache=[]; usersCacheTs=now; return usersCache; } }
  try{ usersCache=JSON.parse(localStorage.getItem('rubix-local-users')||'[]'); usersCacheTs=now; return usersCache; }catch(e){ usersCache=[]; return []; }
}
async function saveLocalUsers(u){ try{ localStorage.setItem('rubix-local-users', JSON.stringify(u)); }catch(e){} }
async function createUser(name, password){
  var users=await loadUsers(true);
  if(users.some(function(u){ return u.name.toLowerCase()===name.toLowerCase(); })) throw new Error('Ник занят');
  var id=uid(); var pwdHash=await hashPwd(id, password);
  var user={ id:id, name:name, password_hash:pwdHash, avatar:null, created_at:new Date().toISOString() };
  if(sb){ var r=await sb.from('rubix_users').insert(user); if(r.error) throw new Error(r.error.message); }
  else { users.push(user); await saveLocalUsers(users); }
  usersCache=null; return user;
}
async function updateUser(id, patch){
  if(sb){ var r=await sb.from('rubix_users').update(patch).eq('id', id); if(r.error) throw new Error(r.error.message); }
  else { var users=await loadUsers(true); var i=users.findIndex(function(u){ return u.id===id; }); if(i!==-1){ Object.assign(users[i], patch); await saveLocalUsers(users); } }
  usersCache=null;
}
async function deleteUser(id){
  if(sb){ await sb.from('rubix_users').delete().eq('id', id); }
  else { var users=await loadUsers(true); users=users.filter(function(u){ return u.id!==id; }); await saveLocalUsers(users); }
  usersCache=null;
}
async function wipeAllUsers(){
  if(sb){ await sb.from('rubix_users').delete().neq('id','__none__'); }
  else { await saveLocalUsers([]); }
  usersCache=null;
}
async function findUserByName(name){ var users=await loadUsers(true); return users.find(function(u){ return u.name.toLowerCase()===name.toLowerCase(); }) || null; }
async function verifyPassword(user, password){ return (await hashPwd(user.id, password)) === user.password_hash; }

var settings = { disableRegistration: false };
async function loadSettings(){
  if(sb){ var r=await sb.from('rubix_settings').select('value').eq('key','global').maybeSingle(); if(r.data && r.data.value) settings=Object.assign(settings, r.data.value); }
  else { try{ var s=JSON.parse(localStorage.getItem('rubix-local-settings')||'null'); if(s) settings=Object.assign(settings, s); }catch(e){} }
}
async function saveSettings(){
  if(sb){ await sb.from('rubix_settings').upsert({key:'global',value:settings,updated_at:new Date().toISOString()}); }
  else { try{ localStorage.setItem('rubix-local-settings', JSON.stringify(settings)); }catch(e){} }
}

var authOverlay=document.getElementById('authOverlay');
var authTabRegister=document.getElementById('authTabRegister');
var paneLogin=document.getElementById('paneLogin'), paneRegister=document.getElementById('paneRegister');
var loginName=document.getElementById('loginName'), loginPwd=document.getElementById('loginPwd');
var loginErr=document.getElementById('loginErr'), loginBtn=document.getElementById('loginBtn');
var regName=document.getElementById('regName'), regPwd=document.getElementById('regPwd');
var regErr=document.getElementById('regErr'), regBtn=document.getElementById('regBtn');

document.querySelectorAll('.auth-tab').forEach(function(t){
  t.addEventListener('click', function(){
    var tab=t.dataset.tab;
    document.querySelectorAll('.auth-tab').forEach(function(x){ x.classList.toggle('active', x===t); });
    paneLogin.classList.toggle('active', tab==='login');
    paneRegister.classList.toggle('active', tab==='register');
    loginErr.textContent=''; regErr.textContent='';
    if(tab==='login') setTimeout(function(){ loginName.focus(); },60);
    else setTimeout(function(){ regName.focus(); },60);
  });
});

async function openAuthModal(){
  authOverlay.classList.add('open');
  await loadSettings();
  if(settings.disableRegistration){ authTabRegister.style.display='none'; document.querySelector('.auth-tab[data-tab="login"]').click(); }
  else { var users=await loadUsers(true); authTabRegister.style.display='';
    if(users.length === 0) authTabRegister.click();
    else document.querySelector('.auth-tab[data-tab="login"]').click(); }
  setTimeout(function(){ loginName.focus(); }, 80);
}

loginBtn.addEventListener('click', async function(){
  var name=loginName.value.trim(), pwd=loginPwd.value;
  loginErr.textContent='';
  if(!name||!pwd){ loginErr.textContent='Введите ник и пароль'; return; }
  loginBtn.disabled=true; loginBtn.textContent='Проверка…';
  try{
    var user=await findUserByName(name);
    if(!user){ loginErr.textContent='Неверный ник или пароль'; loginBtn.disabled=false; loginBtn.textContent='Войти'; return; }
    var ok=await verifyPassword(user, pwd);
    if(!ok){ loginErr.textContent='Неверный ник или пароль'; loginBtn.disabled=false; loginBtn.textContent='Войти'; return; }
    session={ userId:user.id, name:user.name }; saveSession(session);
    try{ var localAv=localStorage.getItem('rubix-avatar:'+user.id); me_avatar=localAv||user.avatar||null; }catch(e){ me_avatar=user.avatar||null; }
    authOverlay.classList.remove('open');
    render(); trackPresence();
  }catch(e){ loginErr.textContent='Ошибка: '+e.message; }
  loginBtn.disabled=false; loginBtn.textContent='Войти';
});
loginPwd.addEventListener('keydown', function(e){ if(e.key==='Enter') loginBtn.click(); });

regBtn.addEventListener('click', async function(){
  var name=regName.value.trim(), pwd=regPwd.value;
  regErr.textContent='';
  if(name.length<NAME_MIN||name.length>NAME_MAX){ regErr.textContent='Ник от '+NAME_MIN+' до '+NAME_MAX+' символов'; return; }
  if(pwd.length<PWD_MIN){ regErr.textContent='Пароль минимум '+PWD_MIN+' символа'; return; }
  await loadSettings();
  var users=await loadUsers(true);
  if(users.length>0 && settings.disableRegistration){ regErr.textContent='Регистрация закрыта'; return; }
  regBtn.disabled=true; regBtn.textContent='Создание…';
  try{
    var user=await createUser(name, pwd);
    session={ userId:user.id, name:user.name }; saveSession(session);
    try{ localStorage.setItem('rubix-name:'+user.id, name); }catch(e){}
    me_avatar=null;
    authOverlay.classList.remove('open');
    render(); trackPresence();
  }catch(e){ regErr.textContent=e.message; }
  regBtn.disabled=false; regBtn.textContent='Создать аккаунт';
});
regPwd.addEventListener('keydown', function(e){ if(e.key==='Enter') regBtn.click(); });

function meName(){ return session ? session.name : 'Гость'; }
function meId(){ return session ? session.userId : null; }
function meInitial(){ return userInitial(meName()); }
async function refreshMeAvatar(){

      function(payload){ var remote=payload.new && payload.new.state; if(!remote) return;
        var ser=JSON.stringify(remote); if(ser===lastSerialized) return;

  if(sb && session){
    sb.channel('kick-'+session.userId)
      .on('postgres_changes', {event:'DELETE', schema:'public', table:'rubix_users'}, function(p){
        if(p.old && p.old.id === session.userId){
          if(sbChannel && sbChannel.untrack) try{ sbChannel.untrack(); }catch(e){}
          session=null; me_avatar=null;
          try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
          location.reload();
        }
      })
      .subscribe();
  }
})();
})();
</script>
